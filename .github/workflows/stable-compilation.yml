name: Stable Compilation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      git-ref:
        description: Git Ref (Optional)
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  flatpak:
    name: "Flatpak (x86_64)"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
    - uses: actions/checkout@v6
    - uses: bilelmoussaoui/flatpak-github-actions/flatpak-builder@v6
      with:
        bundle: EasyRPG-Player.flatpak
        manifest-path: builds/flatpak/org.easyrpg.player.yml
        cache-key: flatpak-builder-${{ github.sha }}

  docker:
    name: ${{ matrix.image }} (${{ matrix.os.arch }})
    runs-on: ${{ matrix.os.name }}
    container:
      image: ${{ matrix.image }}

    strategy:
      fail-fast: false
      matrix:
        image:
          #   version of: # CMake  | g++    | SDL    |     support end  #
          # -------------------------------------------------------------
          - debian:11     # 3.18.4 | 10.2.1 | 2.0.14 | oldstable (8/24) #
          - ubuntu:22.04  # 3.22.1 | 11.2.0 | 2.0.20 | LTS       (4/27) #
          - debian:12     # 3.25.1 | 12.2.0 | 2.26.5 | stable    (6/26) #
          - ubuntu:24.04  # 3.28.3 | 13.2.0 | 2.30.0 | LTS       (4/29) #
        os:
          - arch: x86_64
            name: ubuntu-latest
          - arch: arm64
            name: ubuntu-24.04-arm
        exclude:
          - os:
              arch: arm64
            image: debian:11
          - os:
              arch: arm64
            image: ubuntu:22.04

    steps:
      - &deps
        name: Install dependencies
        run: |
          export DEBIAN_FRONTEND="noninteractive"
          apt-get update
          apt-get install -yqq --no-install-recommends --no-install-suggests \
            ca-certificates build-essential cmake ninja-build git \
            libicu-dev libexpat1-dev libinih-dev nlohmann-json3-dev \
            libsdl2-dev libpng-dev libpixman-1-dev libfmt-dev \
            libfreetype6-dev libharfbuzz-dev libmpg123-dev libsndfile-dev \
            libvorbis-dev libopusfile-dev libspeexdsp-dev liblhasa-dev \
            libdrm-dev libgbm-dev # only needed for sdl2 on debian 11

      - &clone
        name: Clone Repository
        uses: actions/checkout@v6
        if: github.event.inputs.git-ref == ''
      - &cloneref
        name: Clone Repository (with custom ref)
        uses: actions/checkout@v6
        if: github.event.inputs.git-ref != ''
        with:
          ref: ${{ github.event.inputs.git-ref }}

      - name: Use gcc problem matcher
        run: echo "::add-matcher::.github/gcc_comment_matcher.json"

      - name: Compile
        run: |
          VER="(GA, `date +%Y-%m-%d`)"
          cmake -G Ninja -B build . \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wdeprecated -fsanitize=address,undefined" \
            -DPLAYER_BUILD_LIBLCF=ON -DPLAYER_VERSION_APPEND="$VER"
          cmake --build build

      - name: Install
        run: |
          cmake --install build

      - name: Test
        run: |
          # make sure executable runs
          build/easyrpg-player --version
          # run unit tests
          cmake --build build --target check

  appimage:
    name: "AppImage (x86_64)"
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --privileged

    steps:
      - *deps

      - name: Install linuxdeploy dependencies
        run: |
          export DEBIAN_FRONTEND="noninteractive"
          apt-get install -yqq --no-install-recommends --no-install-suggests \
            curl file fuse

      - *clone
      - *cloneref

      - name: Download linuxdeploy
        run: |
          curl -LO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Compile
        run: |
          VER="(GA, `date +%Y-%m-%d`)"
          cmake -G Ninja -B build . \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=AppDir \
            -DPLAYER_BUILD_LIBLCF=ON -DPLAYER_VERSION_APPEND="$VER"
          cmake --build build

      - name: Install
        run: |
          cmake --install build

      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/bin/easyrpg-player \
            --desktop-file AppDir/share/applications/easyrpg-player.desktop \
            --icon-file AppDir/share/pixmaps/easyrpg-player.png \
            --output appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyRPG-Player-AppImage
          path: ./EasyRPG*.AppImage
